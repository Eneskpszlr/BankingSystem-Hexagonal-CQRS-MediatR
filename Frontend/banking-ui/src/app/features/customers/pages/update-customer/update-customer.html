<app-loader [isLoading]="isLoading || isSubmitting"></app-loader>

<div class="container fade-in">
  
  <div class="page-header">
    <h2 class="page-title">Müşteri Bilgilerini Güncelle</h2>
  </div>

  @if (currentCustomer) {
    <div class="layout-sidebar">
      
      <div class="card-panel info-card">
        <h3>Kimlik Bilgileri</h3>
        
        <div class="info-group">
          <label>Ad Soyad</label>
          <div class="info-value">{{ currentCustomer.firstName }} {{ currentCustomer.lastName }}</div>
        </div>

        <div class="info-group">
          <label>TC Kimlik No</label>
          <div class="info-value letter-spacing">{{ currentCustomer.identityNumber }}</div>
        </div>

        <div class="info-warning">
          ⚠️ Kimlik bilgileri yasal zorunluluk gereği sadece şubeden değiştirilebilir.
        </div>
      </div>

      <div class="card-panel form-card">
        <h3>İletişim & Adres</h3>
        
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          
          <div class="form-grid-2-col">
            <div class="form-group">
              <label>E-Posta</label>
              <input type="email" formControlName="email">
            </div>
            <div class="form-group">
              <label>Telefon</label>
              <input type="text" formControlName="phone">
            </div>
          </div>

          <div class="form-group">
            <label>Adres</label>
            <input type="text" formControlName="street" appUppercase>
          </div>

          <div class="form-grid-3-col">
            <div class="form-group">
              <label>Şehir</label>
              <input type="text" formControlName="city" appUppercase>
            </div>
            <div class="form-group">
              <label>Ülke</label>
              <input type="text" formControlName="country" appUppercase>
            </div>
            <div class="form-group">
              <label>Posta Kodu</label>
              <input type="text" formControlName="zipCode">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">Güncelle</button>
            <a routerLink="/customers" class="btn btn-secondary">İptal</a>
          </div>

        </form>
      </div>

    </div>
  }
</div>
