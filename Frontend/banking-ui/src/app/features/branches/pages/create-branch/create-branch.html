<div class="container fade-in">
  <div class="page-header">
    <h2 class="page-title">Yeni Şube Ekle</h2>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <div class="form-grid-main">
        <div class="form-group">
          <label>Şube Adı</label>
          <input type="text" formControlName="name" placeholder="Örn: Merkez Şube">
          @if (hasError('name', 'required')) { <div class="error-message">Şube adı zorunludur.</div> }
        </div>

        <div class="form-group">
          <label>Şube Kodu</label>
          <input type="text" formControlName="code" placeholder="Örn: 34-IST">
          @if (hasError('code', 'required')) { <div class="error-message">Kod zorunludur.</div> }
        </div>
      </div>

      <div class="form-group">
        <label>Adres</label>
        <input type="text" formControlName="street" placeholder="Cadde / Sokak">
      </div>

      <div class="form-grid-location">
        <div class="form-group"><label>Şehir</label><input type="text" formControlName="city"></div>
        <div class="form-group"><label>Ülke</label><input type="text" formControlName="country"></div>
        <div class="form-group"><label>Posta Kodu</label><input type="text" formControlName="zipCode"></div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">Kaydet</button>
        <a routerLink="/branches" class="btn btn-secondary">Vazgeç</a>
      </div>
    </form>
  </div>
</div>
