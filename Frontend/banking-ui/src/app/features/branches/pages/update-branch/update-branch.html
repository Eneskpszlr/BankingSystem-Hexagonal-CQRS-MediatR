<app-loader [isLoading]="isLoading || isSubmitting"></app-loader>

<div class="container fade-in">
  <div class="page-header">
    <h2 class="page-title">Şube Bilgilerini Güncelle</h2>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Şube Adı</label>
        <input type="text" formControlName="name">
      </div>

      <div class="form-group">
        <label>Adres</label>
        <input type="text" formControlName="street">
      </div>

      <div class="form-grid-location">
        <div class="form-group"><label>Şehir</label><input type="text" formControlName="city"></div>
        <div class="form-group"><label>Ülke</label><input type="text" formControlName="country"></div>
        <div class="form-group"><label>Posta Kodu</label><input type="text" formControlName="zipCode"></div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">Güncelle</button>
        <a routerLink="/branches" class="btn btn-secondary">İptal</a>
      </div>
    </form>
  </div>
</div>
