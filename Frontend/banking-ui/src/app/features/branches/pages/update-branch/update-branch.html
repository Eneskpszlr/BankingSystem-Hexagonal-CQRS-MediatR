@if (isLoading || isSubmitting) {
  <app-loader [isLoading]="true"></app-loader>
} @else {

  <div class="container fade-in">
    <div class="page-header">
      <h2 class="page-title">Şube Bilgilerini Güncelle</h2>
    </div>

    <div class="form-card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <div class="form-group">
          <label>Şube Adı</label>
          <input type="text" formControlName="name" placeholder="Örn: Merkez Şube">
           @if (form.get('name')?.invalid && form.get('name')?.touched) {
             <div class="error-message">Şube adı zorunludur.</div>
           }
        </div>

        <div class="form-group">
          <label>Adres</label>
          <input type="text" formControlName="street" placeholder="Tam adres giriniz">
        </div>

        <div class="form-grid-location">
          <div class="form-group">
            <label>Şehir</label>
            <input type="text" formControlName="city">
          </div>
          <div class="form-group">
            <label>Ülke</label>
            <input type="text" formControlName="country">
          </div>
          <div class="form-group">
            <label>Posta Kodu</label>
            <input type="text" formControlName="zipCode">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Güncelleniyor...' : 'Güncelle' }}
          </button>
          <a routerLink="/branches" class="btn btn-secondary">İptal</a>
        </div>
      </form>
    </div>
  </div>

}
