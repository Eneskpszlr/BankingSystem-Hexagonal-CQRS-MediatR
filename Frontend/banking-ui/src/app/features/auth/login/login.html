<app-loader [isLoading]="isLoading"></app-loader>

<div class="auth-container fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon">🏦</div>
      <h2>VB Bank</h2>
      <p>Yönetim paneline giriş yapın</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" formControlName="userName" [class.invalid]="hasError('userName', 'required')">
        
        @if (hasError('userName', 'required')) { 
          <div class="error-msg">Kullanıcı adı boş bırakılamaz.</div> 
        }
      </div>

      <div class="form-group">
        <label>Şifre</label>
        <input type="password" formControlName="password" [class.invalid]="hasError('password', 'required')">
        
        @if (hasError('password', 'required')) { 
          <div class="error-msg">Şifre boş bırakılamaz.</div> 
        }
      </div>

      <button type="submit" class="btn-full" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Giriş Yapılıyor...' : 'Giriş Yap' }}
      </button>

      <div class="auth-footer">
        Hesabınız yok mu? <a routerLink="/auth/register">Kayıt Ol</a>
      </div>
    </form>
  </div>
</div>
