<app-loader [isLoading]="isLoading"></app-loader>

<div class="container fade-in">
  <div class="page-header">
    <h2 class="page-title">Profilim</h2>
  </div>

  <div class="profile-layout">
    
    <div class="profile-card info-card">
      <div class="avatar-large">
        {{ user()?.fullName?.charAt(0) }}
      </div>
      <h3>{{ user()?.fullName }}</h3>
      <span class="role-badge">Müşteri</span>

      <div class="divider"></div>

      <div class="info-row">
        <label>TC Kimlik No</label>
        <span>{{ customerData?.identityNumber }}</span>
      </div>
      <div class="info-row">
        <label>Müşteri No</label>
        <span>#{{ user()?.id }}</span>
      </div>
    </div>

    <div class="profile-card form-card">
      <h3>İletişim Bilgileri</h3>
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          <div class="form-group">
            <label>E-Posta</label>
            <input type="email" formControlName="email">
          </div>
          <div class="form-group">
            <label>Telefon</label>
            <input type="text" formControlName="phone">
          </div>
        </div>

        <div class="form-group">
          <label>Adres</label>
          <input type="text" formControlName="street">
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Şehir</label>
            <input type="text" formControlName="city">
          </div>
          <div class="form-group">
            <label>Posta Kodu</label>
            <input type="text" formControlName="zipCode">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
            Bilgileri Güncelle
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
