<app-loader [isLoading]="isLoading"></app-loader>

<div class="container fade-in">
  <div class="card">
    <div class="card-header">
      <h2>Yeni Hesap Aç</h2>
      <p>Hızlı ve güvenli bir şekilde banka hesabınızı oluşturun.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Şube Seçimi</label>
        <select formControlName="branchId" [class.invalid]="hasError('branchId', 'required')">
          <option value="" disabled>Şube Seçiniz</option>
          @for (branch of branches; track branch.id) {
            <option [value]="branch.id">{{ branch.name }} ({{ branch.code }})</option>
          }
        </select>
        @if (hasError('branchId', 'required')) {
          <div class="error-msg">Hesap açmak için şube seçmelisiniz.</div>
        }
      </div>

      <div class="form-group">
        <label>Para Birimi</label>
        <select formControlName="currencyCode" [class.invalid]="hasError('currencyCode', 'required')">
          <option value="TRY">Türk Lirası (TRY)</option>
          <option value="USD">Amerikan Doları (USD)</option>
          <option value="EUR">Euro (EUR)</option>
        </select>
        @if (hasError('currencyCode', 'required')) {
          <div class="error-msg">Lütfen bir para birimi seçin.</div>
        }
      </div>

      <div class="form-group">
        <label>Açılış Bakiyesi (Opsiyonel)</label>
        <input type="number" formControlName="initialBalance" placeholder="0.00" 
               [class.invalid]="hasError('initialBalance', 'min')">
        
        @if (hasError('initialBalance', 'min')) {
          <div class="error-msg">Bakiye 0'dan küçük olamaz.</div>
        }
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" routerLink="/">İptal</button>
        <button type="submit" class="btn-primary" [disabled]="form.invalid || isLoading">
          {{ isLoading ? 'Oluşturuluyor...' : 'Hesabı Oluştur' }}
        </button>
      </div>

    </form>
  </div>
</div>
